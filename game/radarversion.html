<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROVER // 360° LIDAR</title>
<style>
:root{--bg:#080a0c;--ink:#f4f5f6;--mid:#aeb4ba;--dim:#70777e;--line:rgba(235,240,245,.28)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace;touch-action:manipulation}
body{padding:clamp(10px,2vw,24px);display:flex;flex-direction:column}
.app{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(5px,1vh,10px)}
.top-readout{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;min-height:48px;padding:4px 2px 8px;border-bottom:1px solid var(--line);color:var(--mid);font-size:clamp(9px,1vw,12px);letter-spacing:.12em}
.top-readout .consumption{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:12px;row-gap:2px}
.top-readout .consumption strong{font-size:clamp(14px,1.6vw,19px);letter-spacing:.02em}
.top-readout .consumption span{grid-column:1/-1;color:var(--dim);font-size:9px;letter-spacing:.08em}
.top-readout strong{display:block;color:var(--ink);font-weight:500}
.top-readout .battery{text-align:right;white-space:nowrap}
.top-readout .battery strong{font-size:clamp(20px,2.5vw,29px);color:#fff;letter-spacing:.02em;margin-top:2px}
.radar-stage{position:relative;min-height:0;display:grid;place-items:center;overflow:visible}
.scope{position:relative;width:min(min(58vh,58vw),560px);height:auto;aspect-ratio:1;border-radius:50%;overflow:visible;background:radial-gradient(circle,rgba(255,255,255,.035),rgba(255,255,255,.012) 68%,transparent 69%)}
.map-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
.map-svg .scan-boundary{fill:none;stroke:rgba(245,248,250,.7);stroke-width:1.3}
.map-svg .tick{stroke:rgba(245,248,250,.48);stroke-width:1.5}
.map-svg .tick.major{stroke:rgba(255,255,255,.9);stroke-width:2.4}
.map-svg .terrain-point{fill:rgba(245,248,250,.48)}
.map-svg .object-line{fill:none;stroke:rgba(245,248,250,.86);stroke-width:2.4}
.map-svg .object-fill{fill:rgba(245,248,250,.12);stroke:rgba(245,248,250,.9);stroke-width:2}
.map-svg .object-dot{fill:#fff}
.map-svg .rover{fill:#fff;stroke:#080a0c;stroke-width:3}
.dir-btn{position:absolute;z-index:7;width:clamp(22px,3.2vmin,30px);height:clamp(22px,3.2vmin,30px);border:0;border-radius:0;background:transparent;color:#fff;font:400 clamp(22px,3.1vmin,30px)/1 monospace;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0}
.dir-btn:active,.dir-btn.is-active{color:#aeb4ba;text-shadow:0 0 8px #fff}
.dir-btn:disabled{opacity:.28}
.dir-btn.north{left:50%;top:-3px;transform:translate(-50%,-100%) rotate(-90deg)}
.dir-btn.south{left:50%;bottom:-3px;transform:translate(-50%,100%) rotate(90deg)}
.dir-btn.west{left:-3px;top:50%;transform:translate(-100%,-50%) rotate(180deg)}
.dir-btn.east{right:-3px;top:50%;transform:translate(100%,-50%)}
.dir-btn.northwest{left:14%;top:14%;transform:translate(-100%,-100%) rotate(-135deg)}
.dir-btn.northeast{right:14%;top:14%;transform:translate(100%,-100%) rotate(-45deg)}
.dir-btn.southwest{left:14%;bottom:14%;transform:translate(-100%,100%) rotate(135deg)}
.dir-btn.southeast{right:14%;bottom:14%;transform:translate(100%,100%) rotate(45deg)}
.dir-btn.act-center,.scope-caption,.rover-battery,.hidden-support{display:none}
.log-area{min-height:56px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-items:start;padding-top:6px;border-top:1px solid var(--line);color:var(--mid);font-size:clamp(9px,1vw,11px);line-height:1.4}
.log-left{min-width:0;text-align:left;overflow:hidden}
.log-label{color:var(--dim);letter-spacing:.14em;margin-bottom:4px}
.mission-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mission-message{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;flex:1}
.log-history{color:var(--dim);display:flex;flex-direction:column;gap:1px}
.log-entry{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-button{flex:none;border:1px solid rgba(245,248,250,.65);background:transparent;color:#fff;font:600 10px monospace;letter-spacing:.1em;padding:6px 11px;cursor:pointer}
.action-button:disabled{opacity:.28}
@media(max-width:600px){body{padding:9px}.app{gap:5px}.top-readout{min-height:43px}.top-readout .consumption{column-gap:7px}.top-readout .battery strong{font-size:21px}.scope{width:min(66vw,53vh)}.dir-btn{width:22px;height:22px;font-size:22px}.dir-btn.northwest{left:13%;top:13%}.dir-btn.northeast{right:13%;top:13%}.dir-btn.southwest{left:13%;bottom:13%}.dir-btn.southeast{right:13%;bottom:13%}.log-area{min-height:52px}}
@media(max-height:560px){.scope{width:min(50vh,50vw)}.top-readout{min-height:38px}.log-area{min-height:45px}}
</style>
</head>
<body>
<div class="app">
  <header class="top-readout">
    <div class="consumption">CONSUMPTION<strong id="consumption-visible">30 W</strong><span id="energy-used">ENERGY USED 0.00 Wh</span></div>
    <div class="battery">BATTERY<strong id="battery-visible">12.8/14.0 V</strong></div>
  </header>
  <main class="radar-stage">
    <div class="scope" aria-label="360 degree rover lidar radar">
      <svg class="map-svg" id="map-svg" viewBox="0 0 1500 1500" role="img" aria-label="LIDAR terrain map"></svg>
      <button class="dir-btn northwest" data-direction="NW" aria-label="Northwest">></button>
      <button class="dir-btn north" data-direction="N" aria-label="North">></button>
      <button class="dir-btn northeast" data-direction="NE" aria-label="Northeast">></button>
      <button class="dir-btn west" data-direction="W" aria-label="West">&lt;</button>
      
      <button class="dir-btn east" data-direction="E" aria-label="East">></button>
      <button class="dir-btn southwest" data-direction="SW" aria-label="Southwest">></button>
      <button class="dir-btn south" data-direction="S" aria-label="South">></button>
      <button class="dir-btn southeast" data-direction="SE" aria-label="Southeast">></button>
    </div>
    <div class="hidden-support">
      <div id="task-detail-title"></div><div id="task-detail-text"></div>
      <div id="rover-voltage"></div>
      <button class="task-tab" data-task="0"></button><button class="task-tab" data-task="1"></button><button class="task-tab" data-task="2"></button><button class="task-tab" data-task="3"></button>
    </div>
  </main>
  <footer class="log-area">
    <div class="log-left">
      <div class="log-label">MISSION / EVENT LOG</div>
      <div class="mission-row"><button class="action-button" id="btn-act" disabled>SCAN</button><div class="mission-message" id="mission-message">INFRARED LIDAR INITIALIZED // OBJECT DETECTION RANGE: INNER RING.</div></div>
      <div class="log-history" id="log-history"></div>
    </div>
  </footer>
</div>
<script>

    const MAP_W = 50;
    const MAP_H = 50;
    const VIEW_W = 15;
    const VIEW_H = 15;
    const SCROLL_STEP = 5;
    let viewX = 0;
    let viewY = 0;
    const STEP_MS = 750;
    const CHARGE_MS = 2000;
    const STEPS_PER_CELL_CHARGE = 5;

    const MARKER_CHAR = '\u25CF'; // Solid rover marker
    const TARGET_CHAR = '\u25CB'; // Selected point
    // LIDAR reveals only the central detection circle.
    const LIDAR_RADIUS = 7;
    const BATTERY_CAPACITY_WH = 160;
    let energyUsedWh = 0;
    let currentConsumptionW = 30;

    // Базовый модуль находится в центре карты; робот стартует на соседней клетке.
    let posX = 24;
    let posY = 25;
    let targetX = null;
    let targetY = null;
    let moveDirection = null;
    let moveTimer = null;
    let chargeTimer = null;

    let hp = 20;
    const maxHp = 20;
    let tmp = 24;
    const maxTmp = 100;

    let batCells = 4; // 80% [■■■■□]
    const maxBatCells = 5;
    let stepsSinceChargeLoss = 0;

    const explored = new Set();
    const inventory = new Set(); // 'panel', 'crate', 'assembler'
    const delivered = new Set(); // 'panel', 'crate', 'assembler'

    // Объекты на карте:
    // base: ⬟, rock: ▲, crate: ▣ (полный) / □ (пустой), solar: ▤, assembler: ⌘, broken: ⧅ -> ░, quest: ◇
    const entities = [
      {id:'base',x:25,y:25,w:5,h:3,kind:'base',label:'CONTROL MODULE / BASE'},
      {id:'panel_1',x:19,y:20,w:3,h:3,kind:'solar',label:'SOLAR PANEL',taskItem:'panel',taken:false},
      {id:'crate_1',x:32,y:30,w:3,h:3,kind:'crate',label:'CRATE [WIRING / PARTS / COMP]',taskItem:'crate',opened:false},
      {id:'asm_1',x:35,y:19,w:3,h:3,kind:'assembler',label:'ASSEMBLER FABRICATOR UNIT',taskItem:'assembler',salvaged:false},
      {id:'broken_2',x:20,y:32,w:3,h:3,kind:'broken',label:'BROKEN MODULE [SCRAP]',salvaged:false},
      {id:'quest_1',x:31,y:24,w:1,h:1,kind:'quest',label:'TASK BEACON: SALVAGE SECTOR'},
      {id:'rock_1',x:28,y:21,w:1,h:1,kind:'rock',label:'IMPASSABLE ROCK TERRAIN'},
      {id:'rock_2',x:28,y:22,w:1,h:1,kind:'rock',label:'IMPASSABLE ROCK TERRAIN'},
      {id:'rock_3',x:28,y:23,w:1,h:1,kind:'rock',label:'IMPASSABLE ROCK TERRAIN'},
      {id:'debris_1',x:16,y:27,w:1,h:1,kind:'debris',label:'METAL DEBRIS'},
      {id:'debris_2',x:22,y:34,w:1,h:1,kind:'debris',label:'CERAMIC FRAGMENT'},
      {id:'debris_3',x:38,y:28,w:1,h:1,kind:'debris',label:'CABLE SCRAP'},
      {id:'debris_4',x:40,y:21,w:1,h:1,kind:'debris',label:'STRUCTURAL FRAGMENT'},
      {id:'debris_5',x:14,y:33,w:1,h:1,kind:'debris',label:'METAL DEBRIS'}
    ];

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function writeLog(text) {
      const message=document.getElementById('mission-message');
      const formatted=toImportantMessage(text);
      if(message){message.dataset.manual='true';message.textContent=formatted;}
      const history=document.getElementById('log-history');
      if(history){
        const line=document.createElement('div');
        line.className='log-entry';
        line.textContent='> '+formatted;
        history.prepend(line);
        while(history.children.length>3)history.lastElementChild.remove();
      }
    }

    function toImportantMessage(text){
      const value=String(text).toUpperCase();
      if(value.includes('BLOCKED BY STRUCTURE')||value.includes('ROCK'))return 'OBSTACLE AHEAD // ROCK FORMATION OR STRUCTURE';
      if(value.includes('MAP LIMIT'))return 'MAP LIMIT // NO FURTHER TERRAIN IN THIS DIRECTION';
      if(value.includes('NO INTERACTIVE OBJECT'))return 'NO OBJECT IN RANGE // MOVE CLOSER AND USE ACT';
      if(value.includes('PICKED UP SOLAR'))return 'ITEM RECOVERED // SOLAR PANEL — RETURN TO CONTROL MODULE';
      if(value.includes('OPENED CRATE'))return 'OBJECT OPENED // SUPPLIES AND COMPONENTS RECOVERED';
      if(value.includes('SALVAGED ASSEMBLER'))return 'OBJECT RECOVERED // ASSEMBLER COMPONENTS — RETURN TO BASE';
      if(value.includes('BASE CHARGING')||value.includes('CHARGING AT BASE'))return 'ROVER CHARGING // REMAIN NEAR CONTROL MODULE';
      if(value.includes('BATTERY')||value.includes('BAT '))return value;
      if(value.includes('DELIVERED'))return 'SUPPLIES DELIVERED // '+value;
      if(value.includes('QUEST COMPLETE'))return 'MISSION OBJECTIVE COMPLETE // '+value;
      if(value.includes('DRIVE '))return 'ROVER MOVED // CONTINUE SURVEYING TERRAIN';
      if(value.includes('UNEXPLORED'))return 'UNEXPLORED TERRAIN // MOVE ROVER TO SCAN AREA';
      return value;
    }

    function setMoveStateLabel(label) {
      // Movement state is communicated through mission messages, not the battery readout.
    }

    function makeAsciiBar(val, maxVal, width, fillChar, emptyChar) {
      const clamped = Math.max(0, Math.min(maxVal, val));
      const filled = maxVal > 0 ? Math.round((clamped / maxVal) * width) : 0;
      return '[' + fillChar.repeat(filled) + emptyChar.repeat(width - filled) + ']';
    }

    const taskData=[
      {title:'01 // SURVEY',text:'Use the directional controls to move the rover one cell at a time. Explore nearby terrain, inspect detected objects and obstacles, and press ACT when close to equipment.'},
      {title:'02 // FIND ENERGY',text:'Locate solar panels, battery banks, generators and RTG units. Minimum infrastructure: one solar panel and one battery bank. Approach equipment and use ACT to interact.'},
      {title:'03 // FIND UNITS',text:'Search for other rovers, autonomous robots, communication stations and processing modules. Approach discovered equipment to inspect it.'},
      {title:'04 // RECOVER PARTS',text:'Locate salvageable components, wiring, tools and structural fragments. Move close to an object and use ACT to collect or recover it, then return to the control module.'}
    ];
    let selectedTask=0;
    function selectTask(index){
      selectedTask=Math.max(0,Math.min(taskData.length-1,index));
      document.querySelectorAll('.task-tab').forEach((button,i)=>button.classList.toggle('active',i===selectedTask));
      document.getElementById('task-detail-title').textContent=taskData[selectedTask].title;
      document.getElementById('task-detail-text').textContent=taskData[selectedTask].text;
      updateTaskStatus();
    }
    function updateTaskStatus() {
      const message=document.getElementById('mission-message');
      if(!message)return;
      if(chargeTimer!==null)message.textContent='ROVER IS CONNECTED TO THE CONTROL MODULE AND CHARGING. WAIT UNTIL BATTERY RECOVERY IS COMPLETE.';
      else if(batCells<=1)message.textContent='CRITICAL BATTERY: RETURN TO CONTROL MODULE IMMEDIATELY. ROVER POWER IS ALMOST DEPLETED.';
      else if(batCells<=2)message.textContent='LOW BATTERY: RETURN TO CONTROL MODULE FOR RECHARGING BEFORE CONTINUING THE SURVEY.';
      else if(batCells<=3)message.textContent='BATTERY WARNING: PLAN A RETURN TO THE CONTROL MODULE FOR RECHARGING.';
      else if(!message.dataset.manual)message.textContent='IMPORTANT // PROCEED WITH ROVER TO SURVEY NEARBY TERRAIN. APPROACH OBJECTS AND USE ACT.';
    }

    function renderVitals() {
      const volts=[9.0,10.2,11.1,11.8,12.8,14.0][batCells];
      const readout=document.getElementById('battery-visible');
      if(readout)readout.textContent=volts.toFixed(1)+'/14.0 V';
      const hidden=document.getElementById('rover-voltage');
      if(hidden)hidden.textContent=volts.toFixed(1)+'/14.0 V';
      updateEnergyReadout(); updateTaskStatus();
    }

    function scrollMap(dx, dy) {
      viewX = Math.max(0, Math.min(MAP_W - VIEW_W, viewX + dx));
      viewY = Math.max(0, Math.min(MAP_H - VIEW_H, viewY + dy));
      renderMap();
    }

    function updateMapNav() {
      // The rover stays at the center of the radar; the map follows its position.
    }

    function getEntityAt(x,y) {
      return entities.find(e=>x>=e.x&&x<e.x+(e.w||1)&&y>=e.y&&y<e.y+(e.h||1))||null;
    }
    function revealAroundUnit(){
      for(let y=posY-LIDAR_RADIUS;y<=posY+LIDAR_RADIUS;y++)for(let x=posX-LIDAR_RADIUS;x<=posX+LIDAR_RADIUS;x++)
        if((x-posX)**2+(y-posY)**2<=LIDAR_RADIUS**2&&x>=0&&y>=0&&x<MAP_W&&y<MAP_H)explored.add(x+','+y);
    }
    function updateEnergyReadout(){
      const c=document.getElementById('consumption-visible');
      const e=document.getElementById('energy-used');
      if(c)c.textContent=currentConsumptionW+' W';
      if(e)e.textContent='ENERGY USED '+energyUsedWh.toFixed(2)+' Wh / '+BATTERY_CAPACITY_WH+' Wh CAPACITY';
    }
    function recordEnergy(powerW,durationMs){
      energyUsedWh+=powerW*(durationMs/3600000);
      currentConsumptionW=30;
      updateEnergyReadout();
    }
    function recordManipulatorEnergy(){
      energyUsedWh+=60*(2000/3600000);
      currentConsumptionW=60; updateEnergyReadout();
      setTimeout(()=>{currentConsumptionW=30;updateEnergyReadout();},2000);
    }
    function setActionLabel(){
      const btn=document.getElementById('btn-act'); if(!btn)return;
      const ent=findNearbyInteractive();
      const labels={base:inventory.size?'CONNECT':'CHARGE',solar:'PICK UP',crate:'OPEN',assembler:'SALVAGE',broken:'SALVAGE'};
      btn.textContent=ent?(labels[ent.kind]||'ACT'):'SCAN'; btn.disabled=!ent;
    }
    function structureGlyph(ent,x,y){
      const w=ent.w||1,h=ent.h||1,lx=x-ent.x,ly=y-ent.y;
      if(w===1&&h===1)return getEntitySymbol(ent);
      if(lx===Math.floor(w/2)&&ly===Math.floor(h/2))return getEntitySymbol(ent);
      return '';
    }

    function getEntitySymbol(ent) {
      if (!ent) return '';
      if (ent.kind === 'base') return '\u2B1F';      // ⬟
      if (ent.kind === 'rock') return '\u25B2';      // ▲
      if (ent.kind === 'solar') return ent.taken ? '' : '\u25A4'; // ▤
      if (ent.kind === 'crate') return ent.opened ? '\u25A1' : '\u25A3'; // □ / ▣
      if (ent.kind === 'assembler') return ent.salvaged ? '\u2591' : '\u2699'; // ⚙ / ░
      // ⌘ is reserved for a future aerial drone / multicopter unit.
      if (ent.kind === 'broken') return ent.salvaged ? '\u2591' : '\u29C5'; // ⧅ / ░
      if (ent.kind === 'quest') return '\u25C7';     // ◇
      if (ent.kind === 'debris') return '\u00B7';
      return '';
    }

    function isAdjacentOrSame(x1,y1,x2,y2){return Math.abs(x1-x2)<=1&&Math.abs(y1-y2)<=1;}
    function isAdjacentToEntity(x,y,ent){
      const right=ent.x+(ent.w||1)-1,bottom=ent.y+(ent.h||1)-1;
      return x>=ent.x-1&&x<=right+1&&y>=ent.y-1&&y<=bottom+1;
    }

    function findNearbyInteractive() {
      const baseEnt = entities.find((e) => e.kind === 'base');
      if (baseEnt && isAdjacentToEntity(posX,posY,baseEnt)) {
        if (inventory.size > 0 || batCells < maxBatCells) {
          return baseEnt;
        }
      }

      for (const ent of entities) {
        if (ent.kind === 'rock' || ent.kind === 'base' || ent.kind === 'quest') continue;
        if (!isAdjacentToEntity(posX,posY,ent)) continue;

        if (ent.kind === 'solar' && !ent.taken) return ent;
        if (ent.kind === 'crate' && !ent.opened) return ent;
        if (ent.kind === 'assembler' && !ent.salvaged) return ent;
        if (ent.kind === 'broken' && !ent.salvaged) return ent;
      }

      if (baseEnt && isAdjacentToEntity(posX,posY,baseEnt)) {
        return baseEnt;
      }

      return null;
    }

    function updateActButton() {
      setActionLabel();
    }

    function stopMovement(reasonText) {
      if (moveTimer !== null) {
        clearTimeout(moveTimer);
        moveTimer = null;
      }
      moveDirection = null;
      document.querySelectorAll('.dir-btn').forEach((button) => button.classList.remove('is-active'));
      if (!chargeTimer) setMoveStateLabel('IDLE');
      if (reasonText) {
        setMoveStateLabel(reasonText.includes('BLOCKED')||reasonText.includes('LIMIT')?'BLOCKED':'IDLE');
        writeLog(reasonText);
      }
    }

    function updateBaseCharging() {
      const baseEnt = entities.find((e) => e.kind === 'base');
      const nearBase = baseEnt && isAdjacentToEntity(posX,posY,baseEnt);

      if (nearBase && batCells < maxBatCells) {
        if (chargeTimer === null) {
          chargeTimer = setInterval(() => {
            const b = entities.find((e) => e.kind === 'base');
            if (!b || !isAdjacentToEntity(posX,posY,b) || batCells >= maxBatCells) {
              clearInterval(chargeTimer);
              chargeTimer = null;
              renderVitals();
              if (moveTimer === null) setMoveStateLabel('IDLE');
              return;
            }
            batCells = Math.min(maxBatCells, batCells + 1);
            stepsSinceChargeLoss = 0;
            renderVitals();
            writeLog('BASE CHARGING: BAT ' + (batCells * 20) + '%');
            if (batCells === maxBatCells) {
              clearInterval(chargeTimer);
              chargeTimer = null;
              renderVitals();
              if (moveTimer === null) setMoveStateLabel('IDLE');
              writeLog('BATTERY FULL [100%]');
            }
          }, CHARGE_MS);
          renderVitals();
        }
        if (moveTimer === null) {
          setMoveStateLabel('CHARGING');
        }
      } else if (chargeTimer !== null) {
        clearInterval(chargeTimer);
        chargeTimer = null;
        renderVitals();
        if (moveTimer === null) {
          setMoveStateLabel('IDLE');
        }
      }
    }

    function updateReadout() {
      // Coordinates are shown in the telemetry line once the dedicated nav header is introduced.
    }

    function renderMap() {
      const svg=document.getElementById('map-svg');
      updateReadout(); updateActButton(); updateBaseCharging(); updateMapNav(); revealAroundUnit();
      const parts=[];
      parts.push('<defs><clipPath id="lidarClip"><circle cx="750" cy="750" r="730"/></clipPath></defs>');
      for(let i=0;i<24;i++){
        const a=i*15-90,nearest=Math.round(a/45)*45;
        const delta=Math.abs(((a-nearest+180)%360+360)%360-180);
        if(delta<9)continue;
        const rad=a*Math.PI/180,major=i%2===0,r1=major?714:720,r2=730;
        parts.push('<line class="tick '+(major?'major':'')+'" x1="'+(750+Math.cos(rad)*r1).toFixed(1)+'" y1="'+(750+Math.sin(rad)*r1).toFixed(1)+'" x2="'+(750+Math.cos(rad)*r2).toFixed(1)+'" y2="'+(750+Math.sin(rad)*r2).toFixed(1)+'"/>');
      }
      parts.push('<circle class="scan-boundary" cx="750" cy="750" r="730"/><g clip-path="url(#lidarClip)">');
      for(let sy=0;sy<VIEW_H;sy++)for(let sx=0;sx<VIEW_W;sx++){
        const x=viewX+sx,y=viewY+sy,dx=sx-7,dy=sy-7;
        if(dx*dx+dy*dy>LIDAR_RADIUS*LIDAR_RADIUS||!explored.has(x+','+y))continue;
        const px=750+dx*100,py=750+dy*100,seed=(x*37+y*61)%11;
        if(seed<7){
          const ox=((x*17+y*13)%43)-21,oy=((x*29+y*7)%39)-19;
          parts.push('<circle class="terrain-point" cx="'+(px+ox)+'" cy="'+(py+oy)+'" r="'+(seed%3+2)+'"/>');
        }
        const ent=getEntityAt(x,y); if(!ent)continue;
        const w=ent.w||1,h=ent.h||1,lx=x-ent.x,ly=y-ent.y;
        if(w>1&&h>1){
          const ex=750+(ent.x-viewX-7)*100-42,ey=750+(ent.y-viewY-7)*100-42;
          if(lx===0&&ly===0)parts.push('<rect class="object-fill" x="'+ex+'" y="'+ey+'" width="'+(w*100-16)+'" height="'+(h*100-16)+'"/>');
          if(lx===Math.floor(w/2)&&ly===Math.floor(h/2))parts.push('<circle class="object-dot" cx="'+px+'" cy="'+py+'" r="7"/>');
        }else if(ent.kind==='rock'){
          parts.push('<path class="object-line" d="M '+(px-19)+' '+(py+17)+' L '+px+' '+(py-21)+' L '+(px+19)+' '+(py+17)+' Z"/>');
        }else if(ent.kind==='quest'){
          parts.push('<path class="object-line" d="M '+px+' '+(py-15)+' L '+(px+15)+' '+py+' L '+px+' '+(py+15)+' L '+(px-15)+' '+py+' Z"/>');
        }else if(ent.kind==='debris'){
          parts.push('<path class="object-line" d="M '+(px-9)+' '+(py-3)+' l 18 6 M '+(px-4)+' '+(py-10)+' l 8 20"/>');
        }else{
          parts.push('<rect class="object-line" x="'+(px-17)+'" y="'+(py-17)+'" width="34" height="34"/><circle class="object-dot" cx="'+px+'" cy="'+py+'" r="4"/>');
        }
      }
      const rx=750+(posX-viewX-7)*100,ry=750+(posY-viewY-7)*100;
      parts.push('<circle class="rover" cx="'+rx+'" cy="'+ry+'" r="8"/></g>');
      svg.innerHTML=parts.join('');
    }

    function describeCell(x, y) {
      const ent = getEntityAt(x, y);
      const coord = '[' + pad2(x) + ',' + pad2(y) + ']';
      if(!explored.has(x+','+y))return coord+' UNEXPLORED';
      if (x === posX && y === posY) {
        return coord + ' UNIT @ POS (BAT ' + (batCells * 20) + '%)';
      }
      if (!ent) {
        return coord + ' OPEN GROUND';
      }
      if (ent.kind === 'base') {
        return coord + ' BASE [⬟] CHARGE + QUEST DROP-OFF';
      }
      if (ent.kind === 'rock') {
        return coord + ' ROCKS [▲] IMPASSABLE';
      }
      if (ent.kind === 'solar') {
        return coord + (ent.taken ? ' SOLAR MOUNT [EMPTY]' : ' SOLAR PANEL [▤] QUEST ITEM');
      }
      if (ent.kind === 'crate') {
        return coord + (ent.opened ? ' CRATE [□] EMPTY' : ' CRATE [▣] WIRING/PARTS/COMP');
      }
      if (ent.kind === 'assembler') {
        return coord + (ent.salvaged ? ' ASSEMBLER [░] SALVAGED' : ' ASSEMBLER FABRICATOR [⚙] QUEST ITEM');
      }
      if (ent.kind === 'broken') {
        return coord + (ent.salvaged ? ' WRECK [░] SALVAGED' : ' BROKEN MODULE [⧅] SCRAP');
      }
      if (ent.kind === 'quest') {
        return coord + ' QUEST BEACON [◇] ' + delivered.size + '/3 DONE';
      }
      return coord + ' ' + ent.label;
    }

    function onCellClick(x,y){if(explored.has(x+','+y))writeLog(describeCell(x,y));}

    function getStepVector() {
      const dx = posX === targetX ? 0 : (posX < targetX ? 1 : -1);
      const dy = posY === targetY ? 0 : (posY < targetY ? 1 : -1);

      let dir = '';
      if (dy < 0) dir += 'N';
      else if (dy > 0) dir += 'S';
      if (dx > 0) dir += 'E';
      else if (dx < 0) dir += 'W';

      return { dx, dy, dir };
    }

    function keepUnitInView() {
      viewX = posX - Math.floor(VIEW_W / 2);
      viewY = posY - Math.floor(VIEW_H / 2);
    }

    function stepInDirection() {
      if (!moveDirection) return;
      if (batCells <= 0) {
        stopMovement('ROBOT BATTERY DEPLETED — RETURN TO A POWER SOURCE');
        return;
      }
      const vectors = {N:[0,-1],NE:[1,-1],E:[1,0],SE:[1,1],S:[0,1],SW:[-1,1],W:[-1,0],NW:[-1,-1]};
      const [dx, dy] = vectors[moveDirection];
      const nextX = posX + dx;
      const nextY = posY + dy;
      if (nextX < 0 || nextY < 0 || nextX >= MAP_W || nextY >= MAP_H) {
        stopMovement('MAP LIMIT REACHED');
        return;
      }
      const blocked = getEntityAt(nextX, nextY);
      if (blocked && ['rock','base','solar','crate','assembler','broken'].includes(blocked.kind)) {
        stopMovement('MOVEMENT BLOCKED BY STRUCTURE OR ROCK');
        return;
      }
      posX = nextX;
      posY = nextY;
      const completedDirection = moveDirection;
      moveDirection = null;
      document.querySelectorAll('.dir-btn').forEach((button) => button.classList.remove('is-active'));
      setMoveStateLabel('IDLE');
      const rough = entities.some(e=>e.kind==='debris'&&isAdjacentOrSame(nextX,nextY,e.x,e.y));
      recordEnergy(rough?95:80,STEP_MS);
      stepsSinceChargeLoss += 1;
      if (stepsSinceChargeLoss >= STEPS_PER_CELL_CHARGE) {
        stepsSinceChargeLoss = 0;
        batCells = Math.max(0, batCells - 1);
      }
      keepUnitInView();
      renderVitals();
      renderMap();
      const nearby=entities.find(e=>e.kind!=='debris'&&isAdjacentToEntity(posX,posY,e));
      if(nearby){
        const names={base:'CONTROL MODULE',solar:'SOLAR PANEL',crate:'SUPPLY CRATE',assembler:'ASSEMBLER',broken:'DAMAGED MODULE',rock:'ROCK FORMATION',quest:'UNKNOWN OBJECT'};
        writeLog('OBJECT DETECTED // '+(names[nearby.kind]||'UNKNOWN EQUIPMENT')+' — APPROACH AND USE ACT');
      }else{
        writeLog('AREA SCANNED // NO EQUIPMENT DETECTED. CONTINUE SURVEY.');
      }
      if (batCells <= 0) stopMovement('ROBOT BATTERY DEPLETED — RETURN TO A POWER SOURCE');
    }

    function startDirectionalMovement(direction) {
      if (batCells <= 0) {
        setMoveStateLabel('BATTERY EMPTY');
        writeLog('ROBOT BATTERY DEPLETED — MOVEMENT LOCKED');
        return;
      }
      const vectors={N:[0,-1],NE:[1,-1],E:[1,0],SE:[1,1],S:[0,1],SW:[-1,1],W:[-1,0],NW:[-1,-1]};
      if(!Object.prototype.hasOwnProperty.call(vectors,direction))return;
      if (moveTimer !== null) return;
      moveDirection = direction;
      const vec={N:[0,-1],NE:[1,-1],E:[1,0],SE:[1,1],S:[0,1],SW:[-1,1],W:[-1,0],NW:[-1,-1]}[direction];
      const rough=entities.some(e=>e.kind==='debris'&&isAdjacentOrSame(posX+vec[0],posY+vec[1],e.x,e.y));
      currentConsumptionW=rough?95:80; updateEnergyReadout();
      document.querySelectorAll('.dir-btn').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.direction === direction);
      });
      setMoveStateLabel('MOVING ' + direction);
      moveTimer = setTimeout(() => {
        moveTimer = null;
        stepInDirection();
      }, STEP_MS);
      writeLog('MANUAL DRIVE ' + direction + ' // STEP IN ' + (STEP_MS / 1000).toFixed(2) + ' S');
    }

    function performInteract() {
      const ent = findNearbyInteractive();
      if (!ent) {
        writeLog('NO INTERACTIVE OBJECT NEARBY');
        return;
      }
      recordManipulatorEnergy();

      if (ent.kind === 'base') {
        if (inventory.size > 0) {
          const added = [];
          for (const item of inventory) {
            if (!delivered.has(item)) {
              delivered.add(item);
              added.push(item.toUpperCase());
            }
          }
          inventory.clear();
          renderVitals();
          if (delivered.size >= 3) {
            writeLog('QUEST COMPLETE! 3/3 DELIVERED TO BASE');
          } else {
            writeLog('DELIVERED: ' + added.join(', ') + ' (' + delivered.size + '/3)');
          }
        } else if (batCells < maxBatCells) {
          writeLog('CHARGING AT BASE: +20% EVERY 2S');
        } else {
          writeLog('BASE READY: BAT 100%, NO ITEMS TO DROP');
        }
        renderMap();
        return;
      }

      if (ent.kind === 'solar' && !ent.taken) {
        ent.taken = true;
        inventory.add('panel');
        renderVitals();
        renderMap();
        writeLog('PICKED UP SOLAR PANEL [▤] -> BRING TO BASE');
        return;
      }

      if (ent.kind === 'crate' && !ent.opened) {
        ent.opened = true;
        if (ent.taskItem) inventory.add(ent.taskItem);
        renderVitals();
        renderMap();
        writeLog('OPENED CRATE [▣->□]: LOOTED WIRING/PARTS/COMP');
        return;
      }

      if (ent.kind === 'assembler' && !ent.salvaged) {
        ent.salvaged = true;
        if (ent.taskItem) inventory.add(ent.taskItem);
        renderVitals();
        renderMap();
        writeLog('SALVAGED ASSEMBLER [⚙] -> BRING TO BASE');
        return;
      }

      if (ent.kind === 'broken' && !ent.salvaged) {
        ent.salvaged = true;
        tmp = Math.min(maxTmp, tmp + 4);
        renderVitals();
        renderMap();
        writeLog('SALVAGED BROKEN MODULE [⧅->░] [+4 TMP]');
      }
    }

    document.querySelectorAll('.dir-btn[data-direction]').forEach(button=>button.addEventListener('click',()=>startDirectionalMovement(button.dataset.direction)));
    document.querySelectorAll('.task-tab').forEach(button=>button.addEventListener('click',()=>{document.getElementById('mission-message').dataset.manual='';selectTask(Number(button.dataset.task));}));
    document.getElementById('btn-act').addEventListener('click', performInteract);
    selectTask(0);

    // Начальная область просмотра центрирована на базовом модуле.
    viewX = posX - Math.floor(VIEW_W / 2);
    viewY = posY - Math.floor(VIEW_H / 2);
    revealAroundUnit();
    renderVitals();
    renderMap();

  updateEnergyReadout();
</script>
</body>
</html>
