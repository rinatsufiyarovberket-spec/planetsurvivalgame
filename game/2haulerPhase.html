<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EDGE FRAME // TERMINAL</title>
<style>
  :root {
    --bg:         #090A0B;
    --grn-main:   #b8bec0;
    --grn-bright: #e3e6e6;
    --grn-mid:    #9ba3a5;
    --grn-dim:    #626b6e;
    --grn-muted:  #858e91;
    --grn-bg:     rgba(220, 226, 228, 0.035);
    --grn-active: rgba(220, 226, 228, 0.16);
    --crim:       #d73019;
    --pad:        2%;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg);
    color: var(--grn-bright);
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', 'Consolas', 'Courier New', monospace;
    touch-action: manipulation;
  }

  body {
    padding: var(--pad);
    display: flex;
  }

  .edge-frame {
    position: relative;
    width: 100%;
    height: 100%;
    border: 2px solid var(--grn-main);
    padding: 1.6% 2%;
    display: grid;
    grid-template-rows: minmax(0, 1fr);
    gap: 0;
  }

  .edge-frame::before,
  .edge-frame::after {
    content: "";
    position: absolute;
    width: 3%;
    height: 3%;
    min-width: 14px;
    min-height: 14px;
    max-width: 24px;
    max-height: 24px;
    border-color: var(--grn-bright);
    border-style: solid;
    pointer-events: none;
  }

  .edge-frame::before {
    top: -2px;
    left: -2px;
    border-width: 4px 0 0 4px;
  }

  .edge-frame::after {
    bottom: -2px;
    right: -2px;
    border-width: 0 4px 4px 0;
  }

  .status-line {
    font-size: clamp(10px, 1.45vw, 13px);
    letter-spacing: 1.5px;
    color: var(--grn-main);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .status-dim {
    color: var(--grn-muted);
  }

  .layout-grid {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) minmax(190px, 29%);
    gap: 1.2%;
  }

  .panel {
    width: 100%;
    height: 100%;
    min-height: 0;
    border: 1px solid var(--grn-main);
    background-color: var(--grn-bg);
    padding: 1.4% 1.8%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    font-size: clamp(10px, 1.35vw, 12px);
    letter-spacing: 1.5px;
    color: var(--grn-bright);
    padding-bottom: 4px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--grn-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .map-panel {
    padding: 1.2% 1.5%;
  }

  .map-viewport {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }

  .map-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(25,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));background-image:repeating-radial-gradient(ellipse at 28% 35%,transparent 0 22px,rgba(184,190,192,.055) 23px 24px,transparent 25px 48px),repeating-radial-gradient(ellipse at 72% 68%,transparent 0 31px,rgba(184,190,192,.045) 32px 33px,transparent 34px 64px)}

  .map-nav {
    position: absolute;
    z-index: 2;
    width: 30px;
    height: 30px;
    border: 1px solid var(--grn-main);
    background: rgba(9, 10, 11, 0.94);
    color: var(--grn-bright);
    font: bold 17px monospace;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .map-nav:active { background: var(--grn-active); }
  .map-nav:disabled { opacity: .25; cursor: not-allowed; }
  .map-nav.north,.map-nav.south{left:8%;width:84%;height:22px}.map-nav.north{top:0}.map-nav.south{bottom:0}.map-nav.west,.map-nav.east{top:8%;height:84%;width:22px}.map-nav.west{left:0}.map-nav.east{right:0}

  .map-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 2.8vmin, 22px);
    line-height: 1;
    cursor: pointer;
    color: var(--grn-main);
    overflow: visible;
  }

  .map-cell:hover {
    background-color: rgba(220, 226, 228, 0.08);
  }

  .map-cell.corner {
    color: var(--grn-muted);
    font-size: clamp(10px, 1.9vmin, 15px);
  }

  .map-cell.obj-base {
    color: var(--grn-bright);
    font-weight: bold;
  }

  .map-cell.obj-hazard {
    color: var(--grn-main);
  }

  .map-cell.obj-item {
    color: var(--grn-bright);
  }

  .map-cell.target {
    color: #ffffff;
  }

   .map-cell.marker {
    color: var(--grn-bright);
    font-size: clamp(14px, 3vmin, 23px);
    font-weight: 900;
    text-shadow: 0 0 4px rgba(227,230,230,.55);
  }
  .map-cell.sector {
    color: var(--grn-muted);
    font-size: clamp(10px, 2vmin, 16px);
    font-weight: 700;
  }
  .telemetry {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(5px,1vw,12px);
    white-space:nowrap;
    overflow:hidden;
    font-size:clamp(7px,1vw,11px);
    letter-spacing:clamp(.1px,.12vw,.8px);
  }
  .telemetry-left {display:flex;align-items:center;gap:clamp(5px,.9vw,12px);min-width:0;white-space:nowrap}
  .telemetry-center {flex:0 0 auto;text-align:center;white-space:nowrap}
  .telemetry-right {flex:0 0 auto;text-align:right;white-space:nowrap;color:var(--grn-bright)}
  .quest-board {gap:7px}
  .important-message {
    min-height:30px;padding:6px 8px;border:1px solid var(--grn-dim);
    color:var(--grn-bright);background:rgba(220,226,228,.045);
    font-size:clamp(9px,1.05vw,12px);line-height:1.25;
    white-space:nowrap;text-overflow:ellipsis;overflow:hidden;
  }
  .task-tabs {display:flex;gap:6px;width:100%;flex-shrink:0}
  .task-tab {
    flex:1;min-width:0;padding:8px 4px;border:1px solid var(--grn-dim);
    background:rgba(220,226,228,.08);color:var(--grn-main);
    font: bold clamp(9px,1.15vw,12px) 'DejaVu Sans Mono',monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .task-tab.active {background:var(--grn-bright);border-color:var(--grn-bright);color:#101416}
  .task-detail-panel {min-height:0;flex:1;border-left:2px solid var(--grn-mid);padding:5px 9px;background:var(--grn-bg);overflow:auto}
  .task-detail-title {color:var(--grn-bright);font-weight:bold;font-size:clamp(11px,1.25vw,13px);margin-bottom:5px}
  .task-detail-text {color:var(--grn-main);font-size:clamp(10px,1.15vw,13px);line-height:1.4}
  .map-cell.structure {font-weight:900;font-size:clamp(17px,3.8vmin,29px);line-height:1;text-shadow:0 0 1px currentColor;z-index:1;overflow:visible}
  .map-cell.obj-base,.map-cell.obj-item {color:var(--grn-bright)}
  .map-cell.sector {color:var(--grn-muted);font-size:clamp(10px,1.8vmin,15px);font-weight:800}
  

  .dock-panel {
    padding: 0;
    border: 0;
    background: transparent;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(170px, 18%);
    gap: 1.2%;
  }

  .log-unified {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 8px;
    overflow: hidden;
  }

  .quest-board {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow: auto;
    padding-right: 4px;
  }
  .quest-heading {
    color: var(--grn-bright);
    font-size: clamp(12px, 1.45vw, 14px);
    letter-spacing: 1.3px;
    border-bottom: 1px solid var(--grn-dim);
    padding-bottom: 4px;
  }
  .quest-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: start;
    font-size: clamp(12px, 1.35vw, 14px);
    line-height: 1.42;
  }
  .quest-name { color: var(--grn-bright); font-weight: bold; }
  .quest-detail { color: var(--grn-main); }
  .quest-state { color: var(--grn-bright); white-space: nowrap; }
  .quest-row.locked .quest-name,
  .quest-row.locked .quest-detail,
  .quest-row.locked .quest-state { color: var(--grn-dim); }

  .log-body {
    flex: 0 0 auto;
    min-height: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding-top: 5px;
    border-top: 1px solid var(--grn-dim);
    font-size: clamp(9px, 1.05vw, 11px);
    line-height: 1.2;
    overflow: hidden;
  }

  .vitals-inline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--grn-dim);
    font-size: clamp(9px, 1.25vw, 11.5px);
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    flex-shrink: 0;
  }

  .stat-inline-group {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  .stat-lbl {
    color: var(--grn-bright);
    font-weight: bold;
  }

  .stat-val {
    color: var(--grn-main);
  }

  .stat-bar {
    color: var(--grn-main);
  }

  .stat-bar.hp-bar {
    color: var(--grn-bright);
  }

  .stat-bar.tmp-bar.hot {
    color: var(--crim);
  }

  .stat-bar.bat-bar.low {
    color: var(--crim);
  }

  .move-badge {
    color: var(--grn-muted);
    font-size: clamp(9px, 1.15vw, 11px);
    letter-spacing: 0.8px;
    flex-shrink: 0;
  }

  .log-body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding-top: 3px;
    font-size: clamp(10px, 1.35vw, 12.5px);
    line-height: 1.2;
    overflow: hidden;
  }

  .log-line {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .log-line.dim {
    color: var(--grn-muted);
  }

  .control-column {
    min-width: 0;
    min-height: 0;
    border-left: 1px solid var(--grn-dim);
    padding-left: 8px;
    display: grid;
    grid-template-rows: auto minmax(100px, 1fr) auto;
    gap: 10px;
  }
  .joystick-wrap{display:grid;place-items:center;min-height:0}.joystick{width:min(34vh,34vw,230px);height:min(34vh,34vw,230px);aspect-ratio:1;border:1px solid var(--grn-main);border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle,rgba(220,226,228,.08) 0 22%,transparent 23% 47%,rgba(220,226,228,.10) 48% 49%,transparent 50% 72%,rgba(220,226,228,.10) 73% 74%,transparent 75%)}.joystick:before,.joystick:after{content:'';position:absolute;background:rgba(220,226,228,.15)}.joystick:before{width:1px;height:100%;left:50%;top:0}.joystick:after{height:1px;width:100%;top:50%;left:0}.joystick-knob{position:absolute;width:30%;height:30%;left:35%;top:35%;border:1px solid var(--grn-bright);border-radius:50%;background:rgba(220,226,228,.16);pointer-events:none}.power-status{width:100%;min-height:42px;padding:6px 8px;border:1px solid var(--grn-main);background:rgba(220,226,228,.045);color:var(--grn-bright);font:800 clamp(11px,1.5vw,15px) monospace;cursor:pointer}.power-status:disabled{cursor:default;opacity:.9}.object-callout{position:absolute;z-index:3;right:5%;top:8%;max-width:30%;padding:5px 8px;border-left:1px solid var(--grn-bright);background:rgba(9,10,11,.78);font-size:clamp(9px,1vw,12px);line-height:1.35;color:var(--grn-bright);pointer-events:none}.unit-marker{position:absolute;z-index:4;width:0;height:0;pointer-events:none;color:#fff;text-shadow:0 0 8px currentColor;font-size:22px;line-height:1;transform:translate(-50%,-50%)}.unit-marker:before{content:'◇';position:absolute;transform:translate(-50%,-50%)}
  .dir-btn {
    min-width: 0;
    min-height: 46px;
    border: 1px solid var(--grn-main);
    background: var(--bg);
    color: var(--grn-bright);
    font: bold 15px monospace;
    cursor: pointer;
    touch-action: manipulation;
  }
  .dir-btn:active, .dir-btn.is-active {
    background: var(--grn-active);
    border-color: var(--grn-bright);
    color: #fff;
  }
  .dir-btn.north { grid-column: 2; grid-row: 1; }
  .dir-btn.west { grid-column: 1; grid-row: 2; }
  .dir-btn.south { grid-column: 2; grid-row: 2; }
  .dir-btn.east { grid-column: 3; grid-row: 2; }
  .power-status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 6px 8px;
    border: 1px solid var(--grn-main);
    background: rgba(220, 226, 228, 0.045);
    color: var(--grn-bright);
    font-size: clamp(13px, 1.65vw, 17px);
    font-weight: 800;
    letter-spacing: .8px;
    white-space: nowrap;
  }

  .ctrl-btn {
    width: 100%;
    height: auto;
    min-height: 34px;
    background-color: var(--bg);
    color: var(--grn-bright);
    border: 1px solid var(--grn-main);
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', 'Consolas', 'Courier New', monospace;
    font-size: clamp(10px, 1.4vw, 12.5px);
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .ctrl-btn:active:not(:disabled),
  .ctrl-btn.is-active {
    background-color: var(--grn-active);
    border-color: var(--grn-bright);
    color: #ffffff;
  }

  .ctrl-btn:disabled {
    color: var(--grn-dim);
    border-color: var(--grn-dim);
    background-color: rgba(220, 226, 228, 0.055);
    cursor: not-allowed;
  }
  .map-cell.unexplored{background:#000;color:#000;cursor:default}
  .map-cell.structure{color:var(--grn-main);font-weight:bold}
  .map-cell.structure.core{color:var(--grn-bright)}
  .map-cell.structure.edge-top{border-top:1px solid var(--grn-main)}
  .map-cell.structure.edge-bottom{border-bottom:1px solid var(--grn-main)}
  .map-cell.structure.edge-left{border-left:1px solid var(--grn-main)}
  .map-cell.structure.edge-right{border-right:1px solid var(--grn-main)}
  .map-cell.sector{color:var(--grn-dim)}
  .telemetry{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(5px,1vw,12px);font-size:clamp(7px,1vw,11px);white-space:nowrap;min-height:22px;overflow:hidden}
  .telemetry-left{display:flex;align-items:center;justify-content:flex-start;gap:clamp(5px,.9vw,12px);min-width:0;white-space:nowrap}
  .telemetry-center{justify-self:center;display:flex;align-items:center;gap:clamp(4px,.8vw,10px);text-align:center;white-space:nowrap}
  .telemetry-right{justify-self:end;text-align:right;color:var(--grn-bright);white-space:nowrap;min-width:0}
  .dock-panel{grid-template-columns:minmax(0,1fr) minmax(190px,23%)}
  .log-unified{display:block;min-width:0;min-height:0;overflow:hidden}
  .quest-row.active{padding:5px 7px;border-left:2px solid var(--grn-bright);background:var(--grn-bg)}
  .control-column{grid-template-rows:auto minmax(150px,1fr);gap:8px}
  .direction-pad{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(42px,1fr));gap:6px;min-height:150px}
  .dir-btn{min-height:42px;font-size:clamp(16px,2.2vw,22px)}
  .dir-btn.north{grid-column:2;grid-row:1}.dir-btn.northeast{grid-column:3;grid-row:1}
  .dir-btn.west{grid-column:1;grid-row:2}.dir-btn.south{grid-column:2;grid-row:3}.dir-btn.east{grid-column:3;grid-row:2}
  .dir-btn.northwest{grid-column:1;grid-row:1}.dir-btn.southwest{grid-column:1;grid-row:3}.dir-btn.southeast{grid-column:3;grid-row:3}
  .dir-btn.act-center{grid-column:2;grid-row:2;font-size:12px}
</style>
</head>
<body>
  <div class="edge-frame">
    <div class="layout-grid">
      <section class="panel map-panel">
        <div class="object-callout" id="object-callout">AREA SCAN // HAULER ACTIVE</div>
        <div class="map-viewport">
          <div class="map-grid" id="map-grid"></div><div class="unit-marker" id="unit-marker"></div>
          <button class="map-nav north" id="map-north" type="button" aria-label="Прокрутить карту на север">↑</button>
          <button class="map-nav south" id="map-south" type="button" aria-label="Прокрутить карту на юг">↓</button>
          <button class="map-nav west" id="map-west" type="button" aria-label="Прокрутить карту на запад">←</button>
          <button class="map-nav east" id="map-east" type="button" aria-label="Прокрутить карту на восток">→</button>
        </div>
      </section>

      <section class="panel dock-panel">
        <div class="log-unified">
          <div class="quest-board">
            <div class="quest-heading important-message" id="mission-message">IMPORTANT // PROCEED WITH ROVER TO SURVEY NEARBY TERRAIN.</div>
            <div class="task-tabs" role="group" aria-label="Mission tasks">
              <button class="task-tab active" data-task="0">WRECKAGE</button><button class="task-tab" data-task="1">SURVIVORS</button><button class="task-tab" data-task="2">INSTALLER</button><button class="task-tab" data-task="3">MMRTG</button><button class="task-tab" data-task="4">UNKNOWN</button>
            </div>
            <div class="task-detail-panel">
              <div class="task-detail-title" id="task-detail-title">01 // FIND ENERGY</div>
              <div class="task-detail-text" id="task-detail-text">Survey nearby terrain. Locate solar panels, battery banks, generators and RTG units. Minimum infrastructure: one solar panel and one battery bank. Approach an object and use ACT to interact.</div>
            </div>
          </div>
        </div>

        <div class="control-column">
          <button class="power-status" id="btn-act" type="button" disabled><span id="rover-voltage">BATTERY // 100%</span></button><div class="joystick-wrap"><div class="joystick" id="joystick" role="application" aria-label="Hauler movement joystick"><div class="joystick-knob" id="joystick-knob"></div></div></div>
        </div>
      </section>
    </div>

  </div>

  <script>
    const MAP_W=120,MAP_H=120,VIEW_W=25,VIEW_H=15,SCROLL_STEP=8;
    let viewX = 0;
    let viewY = 0;
    const STEP_MS=700;
    const CHARGE_MS = 2000;
    const STEPS_PER_CELL_CHARGE = 5;

    const MARKER_CHAR = '\u25CF'; // Solid rover marker
    const TARGET_CHAR = '\u25CB'; // Selected point
    // Fine navigation grid: plus markers at every second cell intersection.
    const SECTOR_SIZE = 2;

    // Базовый модуль находится в центре карты; робот стартует на соседней клетке.
    let posX=58,posY=60;
    let targetX = null;
    let targetY = null;
    let moveDirection=null,moveTimer=null,moveFrame=null,moveLastTime=0,moveProgress=0,moveStartX=posX,moveStartY=posY,moveTargetX=posX,moveTargetY=posY;
    let joystickPointer=null,joystickVector={x:0,y:0},stopAfterSegment=false;
    let chargeTimer = null;

    let hp = 20;
    const maxHp = 20;
    let tmp = 24;
    const maxTmp = 100;

    let batPercent=100;
    const maxBatPercent=100;
    let stepsSinceChargeLoss = 0;

    const explored = new Set();
    const inventory = new Set(); // 'panel', 'crate', 'assembler'
    const delivered = new Set(); // 'panel', 'crate', 'assembler'

    // Объекты на карте:
    // base: ⬟, rock: ▲, crate: ▣ (полный) / □ (пустой), solar: ▤, assembler: ⌘, broken: ⧅ -> ░, quest: ◇
    const entities=[
{id:'base',x:57,y:59,w:5,h:3,kind:'base',label:'CONTROL MODULE / BASE'},
{id:'debris_a',x:48,y:53,kind:'debris',label:'METAL DEBRIS / ALLOY FRAGMENTS',studied:false},
{id:'debris_b',x:66,y:52,kind:'debris',label:'CERAMIC AND COMPOSITE FRAGMENTS',studied:false},
{id:'debris_c',x:72,y:68,kind:'debris',label:'DAMAGED PRESSURE VESSEL',studied:false},
{id:'debris_d',x:43,y:73,kind:'debris',label:'CAPSULE HULL FRAGMENT',studied:false},
{id:'debris_e',x:79,y:45,kind:'debris',label:'ENGINE CASING FRAGMENT',studied:false},
{id:'debris_f',x:36,y:48,kind:'debris',label:'CABLE AND CONNECTOR REMAINS',studied:false},
{id:'debris_g',x:84,y:75,kind:'debris',label:'STRUCTURAL DEBRIS',studied:false},
{id:'survivors_1',x:42,y:88,w:2,h:2,kind:'survivors',label:'EMERGENCY SHELTER / SURVIVORS',found:false},
{id:'installer_1',x:91,y:43,w:4,h:3,kind:'installer',label:'FIELD INSTALLER // DISABLED',salvaged:false},
{id:'mmrtg_1',x:82,y:94,w:2,h:2,kind:'mmrtg',label:'MMRTG POWER UNIT',recovered:false},
{id:'unknown_1',x:108,y:18,w:2,h:2,kind:'unknown',label:'UNKNOWN AUTONOMOUS PLATFORM',inspected:false,hostile:true},
{id:'wreck_1',x:103,y:34,w:4,h:3,kind:'wreck',label:'BURNED VEHICLE WRECK'},
{id:'wreck_2',x:18,y:96,w:5,h:3,kind:'wreck',label:'CAPSULE WRECKAGE'},
{id:'wreck_3',x:95,y:106,w:4,h:4,kind:'wreck',label:'ENGINE SECTION / DESTROYED'}
];

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function writeLog(text) {
      const message=document.getElementById('mission-message');
      if(message){message.dataset.manual='true';message.textContent=toImportantMessage(text);}
    }

    function toImportantMessage(text){
      const value=String(text).toUpperCase();
      if(value.includes('BLOCKED BY STRUCTURE')||value.includes('ROCK'))return 'OBSTACLE AHEAD // ROCK FORMATION OR STRUCTURE';
      if(value.includes('MAP LIMIT'))return 'MAP LIMIT // NO FURTHER TERRAIN IN THIS DIRECTION';
      if(value.includes('NO INTERACTIVE OBJECT'))return 'NO OBJECT IN RANGE // MOVE CLOSER AND USE ACT';
      if(value.includes('PICKED UP SOLAR'))return 'ITEM RECOVERED // SOLAR PANEL — RETURN TO CONTROL MODULE';
      if(value.includes('OPENED CRATE'))return 'OBJECT OPENED // SUPPLIES AND COMPONENTS RECOVERED';
      if(value.includes('SALVAGED ASSEMBLER'))return 'OBJECT RECOVERED // ASSEMBLER COMPONENTS — RETURN TO BASE';
      if(value.includes('BASE CHARGING')||value.includes('CHARGING AT BASE'))return 'ROVER CHARGING // REMAIN NEAR CONTROL MODULE';
      if(value.includes('BATTERY')||value.includes('BAT '))return value;
      if(value.includes('DELIVERED'))return 'SUPPLIES DELIVERED // '+value;
      if(value.includes('QUEST COMPLETE'))return 'MISSION OBJECTIVE COMPLETE // '+value;
      if(value.includes('DRIVE '))return 'ROVER MOVED // CONTINUE SURVEYING TERRAIN';
      if(value.includes('UNEXPLORED'))return 'UNEXPLORED TERRAIN // MOVE ROVER TO SCAN AREA';
      return value;
    }

    function setMoveStateLabel(label) {
      // Movement state is communicated through mission messages, not the battery readout.
    }

    function makeAsciiBar(val, maxVal, width, fillChar, emptyChar) {
      const clamped = Math.max(0, Math.min(maxVal, val));
      const filled = maxVal > 0 ? Math.round((clamped / maxVal) * width) : 0;
      return '[' + fillChar.repeat(filled) + emptyChar.repeat(width - filled) + ']';
    }

    const taskData=[
{title:'01 // SURVEY THE WRECKAGE',text:'Survey the surrounding debris field. Approach fragments and use ACT to classify wreckage, identify useful materials and record structural damage.'},
{title:'02 // LOCATE SURVIVORS',text:'Search for emergency beacons and life-support signatures. Locate the survivor shelter, approach carefully and confirm the survivors for the mission report.'},
{title:'03 // RECOVER FIELD INSTALLER',text:'Locate the disabled field installer. It cannot be repaired in the field. Salvage its working blocks and secure them for delivery to the base. These modules will later be used to convert the hauler into a construction unit.'},
{title:'04 // RECOVER MMRTG',text:'Locate the MMRTG power unit, inspect its condition and load it onto the hauler. Return the recovered unit to the control module.'},
{title:'05 // UNKNOWN CONTACT',text:'A distant autonomous platform has been detected. Its markings do not match known equipment. Remote analysis indicates possible combat modifications. The onboard computer recommends observation only. Do not approach or attempt interaction.'}
];
const missionProgress={debris:0,survivors:false,installer:false,mmrtg:false};
    let selectedTask=0;
    function selectTask(index){
      selectedTask=Math.max(0,Math.min(taskData.length-1,index));
      document.querySelectorAll('.task-tab').forEach((button,i)=>button.classList.toggle('active',i===selectedTask));
      document.getElementById('task-detail-title').textContent=taskData[selectedTask].title;
      document.getElementById('task-detail-text').textContent=taskData[selectedTask].text;
      updateTaskStatus();
    }
    function updateTaskStatus() {
      const message=document.getElementById('mission-message');
      if(!message)return;
      if(chargeTimer!==null)message.textContent='HAULER CONNECTED TO BASE // BATTERY CHARGING';
else if(batPercent<=25)message.textContent='LOW BATTERY // RETURN TO THE CONTROL MODULE';
else if(!message.dataset.manual)message.textContent='IMPORTANT // PROCEED WITH ROVER TO SURVEY NEARBY TERRAIN. APPROACH OBJECTS AND USE ACT.';
    }

    function renderVitals(){
const readout=document.getElementById('rover-voltage'),low=batPercent<=25;
readout.textContent=low?'LOW BATTERY // '+Math.ceil(batPercent)+'%':'BATTERY // '+Math.ceil(batPercent)+'%';
readout.style.color=low?'var(--crim)':'var(--grn-bright)';
updateTaskStatus();updateActButton();
}

    function isSectorEdge(x, y) {
      return x % SECTOR_SIZE === 0 && y % SECTOR_SIZE === 0;
    }

    function scrollMap(dx, dy) {
      viewX = Math.max(0, Math.min(MAP_W - VIEW_W, viewX + dx));
      viewY = Math.max(0, Math.min(MAP_H - VIEW_H, viewY + dy));
      renderMap();
    }

    function updateMapNav() {
      document.getElementById('map-north').disabled = viewY <= 0;
      document.getElementById('map-south').disabled = viewY >= MAP_H - VIEW_H;
      document.getElementById('map-west').disabled = viewX <= 0;
      document.getElementById('map-east').disabled = viewX >= MAP_W - VIEW_W;
    }

    function getEntityAt(x,y) {
      return entities.find(e=>x>=e.x&&x<e.x+(e.w||1)&&y>=e.y&&y<e.y+(e.h||1))||null;
    }
    function revealAroundUnit(){
      for(let y=Math.floor(posY)-7;y<=Math.ceil(posY)+7;y++)for(let x=Math.floor(posX)-7;x<=Math.ceil(posX)+7;x++)if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H&&Math.hypot(x+.5-posX,y+.5-posY)<=7)explored.add(x+','+y);
    }
    function structureGlyph(ent,x,y){
      const w=ent.w||1,h=ent.h||1,lx=x-ent.x,ly=y-ent.y;
      if(w===1&&h===1)return getEntitySymbol(ent);
      if(lx===Math.floor(w/2)&&ly===Math.floor(h/2))return getEntitySymbol(ent);
      return '';
    }

    function getEntitySymbol(ent){
if(!ent)return '';
if(ent.kind==='base')return '⌂';
if(ent.kind==='debris')return ent.studied?'·':'✧';
if(ent.kind==='survivors')return ent.found?'⌁':'▣';
if(ent.kind==='installer')return ent.salvaged?'░':'⚙';
if(ent.kind==='mmrtg')return ent.recovered?'·':'◉';
if(ent.kind==='unknown')return '◇';
if(ent.kind==='wreck')return '▧';
return '';
}

    function isAdjacentOrSame(x1,y1,x2,y2){return Math.abs(x1-x2)<=1&&Math.abs(y1-y2)<=1;}
    function isAdjacentToEntity(x,y,ent){
      const right=ent.x+(ent.w||1)-1,bottom=ent.y+(ent.h||1)-1;
      return x>=ent.x-1&&x<=right+1&&y>=ent.y-1&&y<=bottom+1;
    }

    function findNearbyInteractive() {
      const baseEnt = entities.find((e) => e.kind === 'base');
      if (baseEnt && isAdjacentToEntity(posX,posY,baseEnt)) {
        if (inventory.size > 0 || batPercent < maxBatPercent) {
          return baseEnt;
        }
      }

      for (const ent of entities) {
        if(ent.kind==='base'||ent.kind==='unknown'||ent.kind==='wreck')continue;
        if (!isAdjacentToEntity(posX,posY,ent)) continue;

        if(ent.kind==='debris'&&!ent.studied)return ent;
if(ent.kind==='survivors'&&!ent.found)return ent;
if(ent.kind==='installer'&&!ent.salvaged)return ent;
if(ent.kind==='mmrtg'&&!ent.recovered)return ent;
      }

      if (baseEnt && isAdjacentToEntity(posX,posY,baseEnt)) {
        return baseEnt;
      }

      return null;
    }

    function updateActButton() {
      const btnAct = document.getElementById('btn-act');
      const near=findNearbyInteractive(),base=entities.find(e=>e.kind==='base'),atBase=base&&isAdjacentToEntity(Math.floor(posX),Math.floor(posY),base);
      btnAct.disabled=!near&&!atBase;
      btnAct.textContent=near?'ACT // '+near.kind.toUpperCase().replace('_',' '):atBase?'ACT // BASE SERVICE':document.getElementById('rover-voltage').textContent;
    }

    function stopMovement(reasonText) {
      if (moveTimer !== null) {
        clearTimeout(moveTimer);
        moveTimer = null;
      }
      moveDirection = null;
      document.querySelectorAll('.dir-btn').forEach((button) => button.classList.remove('is-active'));
      if (!chargeTimer) setMoveStateLabel('IDLE');
      if (reasonText) {
        setMoveStateLabel(reasonText.includes('BLOCKED')||reasonText.includes('LIMIT')?'BLOCKED':'IDLE');
        writeLog(reasonText);
      }
    }

    function updateBaseCharging(){
const base=entities.find(e=>e.kind==='base'),near=base&&isAdjacentToEntity(Math.floor(posX),Math.floor(posY),base);
if(near&&batPercent<100){
if(chargeTimer===null)chargeTimer=setInterval(()=>{
const b=entities.find(e=>e.kind==='base');
if(!b||!isAdjacentToEntity(Math.floor(posX),Math.floor(posY),b)||batPercent>=100){clearInterval(chargeTimer);chargeTimer=null;renderVitals();return;}
batPercent=Math.min(100,batPercent+2);renderVitals();
if(batPercent>=100){clearInterval(chargeTimer);chargeTimer=null;renderVitals();}
},CHARGE_MS);
}else if(chargeTimer!==null){clearInterval(chargeTimer);chargeTimer=null;renderVitals();}
}

    function updateReadout() {
      // Coordinates are shown in the telemetry line once the dedicated nav header is introduced.
    }

    function renderMap() {
      const gridEl = document.getElementById('map-grid');
      updateReadout();
      updateActButton();
      updateBaseCharging();

      updateMapNav();
      revealAroundUnit();
      const frag = document.createDocumentFragment();

      for (let sy = 0; sy < VIEW_H; sy++) {
        for (let sx = 0; sx < VIEW_W; sx++) {
          const x = viewX + sx;
          const y = viewY + sy;
          const cell = document.createElement('div');
          cell.className = 'map-cell';
          cell.addEventListener('click',()=>onCellClick(x,y));

          const known=explored.has(x+','+y),ent=known?getEntityAt(x,y):null;
          if(!known){
            cell.classList.add('unexplored');
            if(isSectorEdge(x,y)){cell.classList.add('corner','sector');cell.textContent='+';}
          }
          else if(Math.floor(posX)===x&&Math.floor(posY)===y){cell.classList.add('marker');cell.textContent='';}
          else if(ent){
            cell.classList.add('structure');
            if(ent.kind==='base')cell.classList.add('obj-base');
            else if(ent.kind==='rock')cell.classList.add('obj-hazard');
            else if(!['debris','quest'].includes(ent.kind))cell.classList.add('obj-item');
            const w=ent.w||1,h=ent.h||1,lx=x-ent.x,ly=y-ent.y;
            if(w>3||h>3){
              if(ly===0)cell.classList.add('edge-top');
              if(ly===h-1)cell.classList.add('edge-bottom');
              if(lx===0)cell.classList.add('edge-left');
              if(lx===w-1)cell.classList.add('edge-right');
            }
            const glyph=structureGlyph(ent,x,y);if(glyph)cell.textContent=glyph;
            if(x===ent.x+Math.floor((ent.w||1)/2)&&y===ent.y+Math.floor((ent.h||1)/2))cell.classList.add('core');
          } else if(isSectorEdge(x,y)){cell.classList.add('corner','sector');cell.textContent='+';}

          frag.appendChild(cell);
        }
      }

      gridEl.replaceChildren(frag);
const marker=document.getElementById('unit-marker');if(marker){marker.style.left=((posX-viewX+.5)/VIEW_W*100)+'%';marker.style.top=((posY-viewY+.5)/VIEW_H*100)+'%';}
const callout=document.getElementById('object-callout'),near=findNearbyInteractive();if(callout)callout.textContent=near?near.label+' // IN ACT RANGE':'HAULER // '+Math.ceil(batPercent)+'% BATTERY';
    }

    function describeCell(x, y) {
      const ent = getEntityAt(x, y);
      const coord = '[' + pad2(x) + ',' + pad2(y) + ']';
      if(!explored.has(x+','+y))return coord+' UNEXPLORED';
      if (x === posX && y === posY) {
        return coord + ' UNIT @ POS (BAT ' + (batPercent * 20) + '%)';
      }
      if (!ent) {
        return coord + ' OPEN GROUND';
      }
      if (ent.kind === 'base') {
        return coord + ' BASE [⬟] CHARGE + QUEST DROP-OFF';
      }
      if (ent.kind === 'rock') {
        return coord + ' ROCKS [▲] IMPASSABLE';
      }
      if (ent.kind === 'solar') {
        return coord + (ent.taken ? ' SOLAR MOUNT [EMPTY]' : ' SOLAR PANEL [▤] QUEST ITEM');
      }
      if (ent.kind === 'crate') {
        return coord + (ent.opened ? ' CRATE [□] EMPTY' : ' CRATE [▣] WIRING/PARTS/COMP');
      }
      if (ent.kind === 'assembler') {
        return coord + (ent.salvaged ? ' ASSEMBLER [░] SALVAGED' : ' ASSEMBLER FABRICATOR [⚙] QUEST ITEM');
      }
      if (ent.kind === 'broken') {
        return coord + (ent.salvaged ? ' WRECK [░] SALVAGED' : ' BROKEN MODULE [⧅] SCRAP');
      }
      if (ent.kind === 'quest') {
        return coord + ' QUEST BEACON [◇] ' + delivered.size + '/3 DONE';
      }
      return coord + ' ' + ent.label;
    }

    function onCellClick(x,y){if(explored.has(x+','+y))writeLog(describeCell(x,y));}

    function getStepVector() {
      const dx = posX === targetX ? 0 : (posX < targetX ? 1 : -1);
      const dy = posY === targetY ? 0 : (posY < targetY ? 1 : -1);

      let dir = '';
      if (dy < 0) dir += 'N';
      else if (dy > 0) dir += 'S';
      if (dx > 0) dir += 'E';
      else if (dx < 0) dir += 'W';

      return { dx, dy, dir };
    }

    function keepUnitInView() {
      if (posX < viewX) viewX = posX;
      if (posX >= viewX + VIEW_W) viewX = posX - VIEW_W + 1;
      if (posY < viewY) viewY = posY;
      if (posY >= viewY + VIEW_H) viewY = posY - VIEW_H + 1;
      viewX = Math.max(0, Math.min(MAP_W - VIEW_W, viewX));
      viewY = Math.max(0, Math.min(MAP_H - VIEW_H, viewY));
    }

    const moveVectors={N:[0,-1],NE:[.707,-.707],E:[1,0],SE:[.707,.707],S:[0,1],SW:[-.707,.707],W:[-1,0],NW:[-.707,-.707]};
function directionFromVector(x,y){if(Math.hypot(x,y)<.18)return null;const angle=(Math.atan2(y,x)*180/Math.PI+360)%360;return ['E','SE','S','SW','W','NW','N','NE'][Math.round(angle/45)%8];}
function terrainStepMs(x,y){return Math.sin(x*.31)*Math.cos(y*.27)>.42?980:620;}
function updateJoystickVisual(x,y){const k=document.getElementById('joystick-knob');if(k)k.style.transform='translate('+Math.max(-35,Math.min(35,x*35))+'%,'+Math.max(-35,Math.min(35,y*35))+'%)';}
function setJoystickVector(x,y){
joystickVector={x,y};const next=directionFromVector(x,y);
if(!next){if(moveProgress>0){stopAfterSegment=true;}else{moveDirection=null;if(moveFrame!==null){cancelAnimationFrame(moveFrame);moveFrame=null;moveLastTime=0;}}}
else{moveDirection=next;stopAfterSegment=false;if(moveFrame===null){moveLastTime=0;moveFrame=requestAnimationFrame(animateHauler);}}
updateJoystickVisual(x,y);
}
function animateHauler(timestamp){
if((!moveDirection&&moveProgress===0)||batPercent<=0){moveFrame=null;return;}
if(!moveLastTime)moveLastTime=timestamp;const dt=Math.min(50,timestamp-moveLastTime);moveLastTime=timestamp;
if(moveProgress===0){moveStartX=posX;moveStartY=posY;const v=moveVectors[moveDirection];moveTargetX=moveStartX+v[0];moveTargetY=moveStartY+v[1];const tx=Math.round(moveTargetX),ty=Math.round(moveTargetY),obstacle=getEntityAt(tx,ty);
if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||obstacle&&['base','survivors','installer','mmrtg','wreck'].includes(obstacle.kind)){moveDirection=null;moveFrame=null;writeLog('MOVEMENT BLOCKED // '+(obstacle?.label||'MAP EDGE'));return;}}
moveProgress=Math.min(1,moveProgress+dt/terrainStepMs(moveTargetX,moveTargetY));posX=moveStartX+(moveTargetX-moveStartX)*moveProgress;posY=moveStartY+(moveTargetY-moveStartY)*moveProgress;
revealAroundUnit();keepUnitInView();renderMap();
if(moveProgress>=1){posX=moveTargetX;posY=moveTargetY;batPercent=Math.max(0,batPercent-.45);moveProgress=0;renderVitals();updateBaseCharging();
if(batPercent<=0||stopAfterSegment){moveDirection=null;stopAfterSegment=false;moveFrame=null;moveLastTime=0;return;}}
moveFrame=requestAnimationFrame(animateHauler);
}
function startDirectionalMovement(direction){const v=moveVectors[direction];if(v&&batPercent>0)setJoystickVector(v[0],v[1]);}
function stopDirectionalMovement(){setJoystickVector(0,0);}

    function performInteract(){
const base=entities.find(e=>e.kind==='base');
if(base&&isAdjacentToEntity(Math.floor(posX),Math.floor(posY),base)){if(inventory.size){for(const item of inventory)delivered.add(item);inventory.clear();writeLog('CARGO TRANSFERRED TO BASE // '+[...delivered].join(', ').toUpperCase());}else writeLog('BASE LINK ACTIVE // NO CARGO TO TRANSFER');renderVitals();renderMap();return;}
const ent=findNearbyInteractive();if(!ent){writeLog('NO RECOVERABLE OBJECT IN RANGE');return;}
if(ent.kind==='debris'){ent.studied=true;missionProgress.debris++;writeLog('WRECKAGE ANALYSED // '+ent.label+' // '+missionProgress.debris+'/7 FRAGMENTS');}
else if(ent.kind==='survivors'){ent.found=true;missionProgress.survivors=true;writeLog('SURVIVORS LOCATED // LIFE SIGNS CONFIRMED // REPORT SENT');}
else if(ent.kind==='installer'){ent.salvaged=true;missionProgress.installer=true;inventory.add('installer working blocks');writeLog('FIELD INSTALLER SALVAGED // WORKING BLOCKS SECURED FOR BASE DELIVERY');}
else if(ent.kind==='mmrtg'){ent.recovered=true;missionProgress.mmrtg=true;inventory.add('MMRTG');writeLog('MMRTG RECOVERED // RETURN TO CONTROL MODULE');}
renderVitals();renderMap();
}

    const joystick=document.getElementById('joystick');
function joystickInput(event){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=(event.clientX-cx)/(r.width*.38),dy=(event.clientY-cy)/(r.height*.38),m=Math.hypot(dx,dy),scale=m>1?1/m:1;setJoystickVector(dx*scale,dy*scale);}
joystick.addEventListener('pointerdown',event=>{joystickPointer=event.pointerId;joystick.setPointerCapture(event.pointerId);joystickInput(event);});
joystick.addEventListener('pointermove',event=>{if(event.pointerId===joystickPointer)joystickInput(event);});
const releaseJoystick=event=>{if(event.pointerId===joystickPointer){joystickPointer=null;stopDirectionalMovement();}};
joystick.addEventListener('pointerup',releaseJoystick);joystick.addEventListener('pointercancel',releaseJoystick);
    document.querySelectorAll('.task-tab').forEach(button=>button.addEventListener('click',()=>{document.getElementById('mission-message').dataset.manual='';selectTask(Number(button.dataset.task));}));
    document.getElementById('btn-act').addEventListener('click', performInteract);
    selectTask(0);

    document.getElementById('map-north').addEventListener('click', () => scrollMap(0, -SCROLL_STEP));
    document.getElementById('map-south').addEventListener('click', () => scrollMap(0, SCROLL_STEP));
    document.getElementById('map-west').addEventListener('click', () => scrollMap(-SCROLL_STEP, 0));
    document.getElementById('map-east').addEventListener('click', () => scrollMap(SCROLL_STEP, 0));
    // Начальная область просмотра центрирована на базовом модуле.
    viewX=48;viewY=53;
    revealAroundUnit();
    renderVitals();
    renderMap();
  </script>
